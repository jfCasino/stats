version: "3.9"

services:
  stats-db:
    image: postgres:15
    container_name: stats-db
    environment:
      POSTGRES_DB: ${STATS_DB_NAME:-statsDB}
      POSTGRES_USER: ${STATS_DB_USER:-jf76272}
      POSTGRES_PASSWORD: ${STATS_DB_PASSWORD:-password}
    ports:
      - "5434:5432"
    networks:
      - roulette-network

  stats-service:
    image: jf76272/stats-service:1.0.0
    container_name: stats-service
    ports:
      - "8082:8080"
    environment:
      DB_HOST: ${STATS_DB_HOST:-stats-db}
      DB_PORT: ${STATS_DB_PORT:-5432}
      DB_NAME: ${STATS_DB_NAME:-statsDB}
      DB_USERNAME: ${STATS_DB_USER:-jf76272}
      DB_PASSWORD: ${STATS_DB_PASSWORD:-password}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVER_PORT: 8080
    depends_on:
      - stats-db
    networks:
      - roulette-network

networks:
  roulette-network:
    external: true
